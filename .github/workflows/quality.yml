name: FlippChill Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify BEST56 Baza Mieszkań audit manifest
        run: python tests/check_best56_audit_manifest.py audit/BEST56_BAZA_MIESZKAN_AUDYT.json
      - name: Verify BEST56 Source of Truth consistency
        run: python tests/check_source_of_truth_consistency.py
      - name: Verify BEST56 schema 11 to 12 migration contract
        run: python tests/check_schema_11_12_contract.py
      - name: Static application checks
        run: python tests/check_app.py app/FlippChill_Kalkulator.html
      - name: Verify frozen BEST40 checksum
        run: python tests/check_release_baseline.py versions/FlippChill_Kalkulator_BEST40.html c04106fe884d32dc257d852b320f2e145a93f80e5615409dc5fac17f5b171708
      - name: Verify frozen stable version
        run: python tests/check_app.py versions/FlippChill_Kalkulator_BEST40.html
